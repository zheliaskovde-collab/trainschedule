<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Головна - Розклад потягів</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 100px;">

    <h1>Вітаємо у системі розкладу потягів!</h1>
    <p>Будь ласка, оберіть дію:</p>

    <div style="margin-top: 30px;">
        <!-- 1. Кнопка Входу -->
        <a href="{% url 'login' %}" style="display: inline-block; padding: 12px 24px; font-size: 16px;
         margin-right: 10px; cursor: pointer; background-color: #007BFF; color: white; text-decoration: none; border-radius: 5px;">
            Увійти
        </a>

        <!-- 2. Кнопка Реєстрації -->
        <a href="{% url 'register' %}" style="display: inline-block; padding: 12px 24px; font-size: 16px;
         margin-right: 10px; cursor: pointer; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px;">
            Реєстрація
        </a>

        <!-- 3. Кнопка Адмін-панелі -->
        <a href="{% url 'admin:index' %}" style="display: inline-block; padding: 12px 24px; font-size: 16px;
         cursor: pointer; background-color: #343a40; color: white; text-decoration: none; border-radius: 5px;">
            Панель адміністратора
        </a>
    </div>

</body>
</html>
